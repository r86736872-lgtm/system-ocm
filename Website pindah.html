<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrasi Domain SFD Mission</title>
    <style>
        /* Mengambil font modern dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Latar belakang gelap modern */
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Elemen bercahaya di latar belakang */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .circle-1 {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
            animation: float 6s infinite ease-in-out alternate;
        }
        .circle-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -150px;
            right: -100px;
            animation: float 8s infinite ease-in-out alternate-reverse;
        }

        /* Animasi latar belakang melayang */
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* Desain Kartu dengan efek Kaca (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animasi kartu muncul dari bawah */
        @keyframes slideUpFade {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Desain Ikon dengan efek denyut */
        .icon-wrapper {
            background: rgba(255, 255, 255, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            font-size: 36px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 300;
        }

        strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Desain Tombol Interaktif */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 25px -10px rgba(139, 92, 246, 0.8);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <!-- Elemen Cahaya Latar Belakang -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <!-- Konten Utama -->
    <div class="card">
        <div class="icon-wrapper">
            🚀
        </div>
        <h1>Pemberitahuan</h1>
        <p>Website <strong>SFD Mission</strong> telah pindah domain, silakan pindah ke link terbaru ini.</p>
        
        <!-- Tombol Link -->
        <a href="https://sfd-mission.r86736872.workers.dev/" class="btn">Menuju Link Terbaru</a>
    </div>
</body>
</html>
